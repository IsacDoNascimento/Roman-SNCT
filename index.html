<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ROMAN: Guardiã das Estrelas (Versão Expandida)</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe2c2;--ink:#1d1a2e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b1a;--ink:#efe2c2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0b1a;--ink:#efe2c2;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;user-select:none;-webkit-user-select:none}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;touch-action:none}
canvas{display:block;width:100%;max-width:calc((100vh - 24px)*16/9);height:auto;border:4px solid var(--ink);box-sizing:border-box;background:#1b1440}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540;C.width=W;C.height=H;
const K={};
addEventListener('keydown',e=>{if(!K[e.code])K[e.code]=2;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
const KEYS=[{u:'KeyW',d:'KeyS',l:'KeyA',r:'KeyD',f:'KeyJ',m:'KeyK',x:'KeyL'},{u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight',f:'Comma',m:'Period',x:'Slash'}];
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

let A, bgmNode=null, bgmGain=null, musicOn=true;
function initAudio(){
  if(!A){
    try{
      A=new (window.AudioContext||window.webkitAudioContext)();
    }catch(e){}
  }
  if(A && A.state==='suspended') A.resume();
}

function snd(f,d=.08,ty='square',v=.04,s=0){
  initAudio();
  if(!A)return;
  try{
    const o=A.createOscillator(),g=A.createGain(),n=A.currentTime;
    o.type=ty;o.frequency.setValueAtTime(f,n);
    if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);
    g.gain.setValueAtTime(v,n);
    g.gain.exponentialRampToValueAtTime(.001,n+d);
    o.connect(g);g.connect(A.destination);
    o.start();o.stop(n+d);
  }catch(e){}
}

// BGM Chiptune Synth Generator
let bgmStep=0, bgmTimer=0;
const notes = [220, 261.63, 293.66, 329.63, 392.00, 440, 523.25];
function updateBGM(dt){
  if(!musicOn || !A || scene==='title' || scene==='codex') return;
  bgmTimer += dt;
  if(bgmTimer >= 0.18){
    bgmTimer = 0;
    bgmStep = (bgmStep + 1) % 32;
    if(bgmStep % 4 === 0){
      const bFreq = (bgmStep < 16) ? 110 : 130.81;
      snd(bFreq, 0.15, 'sawtooth', 0.02, -10);
    }
    if(scene === 'play'){
      const melIndex = (bgmStep * 3 + (bgmStep % 5)) % notes.length;
      snd(notes[melIndex], 0.09, 'triangle', 0.015, 0);
    }
  }
}

let scene='title',nP=1,P=[],B,bul=[],sh=[],pk=[],pt=[],asteroids=[],pwItems=[],flashR=0,flashW=0;
let t=0,shake=0,hs=0,tip='',tipT=0,hits=0,clock=0,tm=0,eclipse=0,combo=false,hard=1;
let isTouch = false;
const stars=[];for(let i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2.5+.5});
const V=X.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.0);V.addColorStop(0,'rgba(0,0,0,0)');V.addColorStop(1,'rgba(8,4,20,.65)');

function start(n,h){
  hard=h;nP=n;P=[];
  for(let i=0;i<n;i++)P.push({i,x:110,y:H/2+(n>1?(i?70:-70):0),hp:3,mode:0,cd:0,inv:0,ex:0,alive:1,col:i?'#4fd8c4':'#ff9a47',boost:0,shield:0});
  B={x:W-210,y:H/2,r:92,hp:720,max:720,t:0,ph:1,c1:1.5,c2:1,c3:2,c4:2,c5:3.5,spin:0,stun:0,hit:0,open:0};
  bul=[];sh=[];pk=[];pt=[];asteroids=[];pwItems=[];hits=0;clock=0;eclipse=0;scene='intro';
}

function inp(p,k,held){
  const s=nP==1?[0,1]:[p.i];
  return s.some(j=>{const c=KEYS[j][k];return held?K[c]>0:K[c]==2})||(nP==1&&k=='f'&&held&&K.Space>0);
}

function boom(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=60+Math.random()*260;pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.5,col,r:2+Math.random()*3})}}

function hurt(p){
  if(p.shield > 0){ p.shield = 0; boom(p.x, p.y, '#ffd34d', 20); snd(300, .2, 'sine', .08, -100); return; }
  p.hp--;p.inv=1.6;hits++;shake=14;flashR=0.35;hs=.07;snd(90,.3,'sawtooth',.09,-40);boom(p.x,p.y,'#ff5a4d',18);
  if(p.hp<=0){p.alive=0;boom(p.x,p.y,p.col,40)}
}

function upP(p,dt){
  if(!p.alive)return;
  const dx=(inp(p,'r',1)?1:0)-(inp(p,'l',1)?1:0),dy=(inp(p,'d',1)?1:0)-(inp(p,'u',1)?1:0),l=Math.hypot(dx,dy)||1;
  p.x=cl(p.x+dx/l*330*dt,30,560);p.y=cl(p.y+dy/l*330*dt,30,H-30);
  p.cd-=dt;p.inv-=dt;p.boost=Math.max(0,p.boost-dt);p.shield=Math.max(0,p.shield-dt);

  if(inp(p,'m',0)){p.mode^=1;tip=p.mode?'ROMAN: campo amplo, 100 vezes o do Hubble. Cobre mais área.':'HUBBLE: campo estreito. Tiro forte e preciso.';tipT=3;snd(p.mode?520:320,.1,'triangle',.06,200)}
  
  const fireCD = p.boost > 0 ? (p.mode==0?.05:.08) : (p.mode==0?.09:.14);
  if(inp(p,'f',1)&&p.cd<=0){
    if(p.mode==0){
      sh.push({x:p.x+24,y:p.y,vx:950,vy:0,d:combo?3:2,m:0,pCol:p.col});
      p.cd=fireCD;snd(700,.05,'square',.02);
    }else{
      [-.2,0,.2].forEach(a=>sh.push({x:p.x+20,y:p.y,vx:820*Math.cos(a),vy:820*Math.sin(a),d:combo?1.2:.7,m:1,pCol:p.col}));
      p.cd=fireCD;snd(480,.06,'sawtooth',.015);
    }
  }
  if(inp(p,'x',0)&&p.ex>=5){
    p.ex=0;eclipse=1.6;B.stun=1.6;bul=[];asteroids=[];B.hp-=40;shake=18;flashW=0.4;snd(110,.6,'sawtooth',.1,-60);
    tip='CORONÓGRAFO: bloqueia a luz da estrela para revelar o que está ao redor.';tipT=3.5;
  }
}

function tgt(){const a=P.filter(p=>p.alive);const p=a[Math.random()*a.length|0]||P[0];return Math.atan2(p.y-B.y,p.x-B.x)}

function upB(dt){
  B.t+=dt;B.y=H/2+Math.sin(B.t*.9)*150;B.hit-=dt;B.stun-=dt;B.open-=dt;
  const f=B.hp/B.max,ph=hard?(f>.66?1:f>.33?2:3):1;
  if(ph!=B.ph){B.ph=ph;tip=ph==2?'O espelho está ficando nítido… cuidado com o espiral!':'Quase nítido! A Aberração está furiosa.';tipT=3;shake=10}
  if(B.stun>0)return;
  B.c1-=dt;B.c2-=dt;B.c3-=dt;B.c4-=dt;B.c5-=dt;
  if(B.c1<=0){const n=ph==3?18:12,o=Math.random()*6,sp=150+ph*15;for(let i=0;i<n;i++){const a=o+i/n*6.283;bul.push({x:B.x,y:B.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:7})}B.c1=ph==3?1.7:2.2;B.open=.4;snd(180,.2,'sawtooth',.05,-80)}
  if(B.c2<=0){const a=tgt();(ph==3?[-.18,0,.18]:[0]).forEach(d=>bul.push({x:B.x-40,y:B.y,vx:Math.cos(a+d)*260,vy:Math.sin(a+d)*260,r:6}));B.c2=ph==1?1.2:.9}
  if(ph>=2&&B.c3<=0){B.spin+=.5;bul.push({x:B.x,y:B.y,vx:Math.cos(B.spin*3.1)*200,vy:Math.sin(B.spin*3.1)*200,r:6});B.c3=.11}
  if(B.c4<=0){pk.push({x:B.x-70,y:B.y+(Math.random()-.5)*120,vx:-150,vy:(Math.random()-.5)*60,r:12});B.c4=2.6}
  if(B.c5<=0){
    asteroids.push({x:W+30,y:40+Math.random()*(H-80),vx:-180-Math.random()*100,vy:(Math.random()-.5)*40,r:14+Math.random()*10,hp:2});
    B.c5=2.2+Math.random()*1.5;
  }
}

function step(dt){
  initAudio();
  updateBGM(dt);
  shake=Math.max(0,shake-60*dt);if(tipT>0)tipT-=dt;
  flashR=Math.max(0,flashR-dt);flashW=Math.max(0,flashW-dt);

  const dist = eclipse > 0 ? 3.5 : 1.0;
  stars.forEach(s=>{
    s.x-=s.z*22*dist*dt;
    if(eclipse>0) s.y += Math.sin(t*8 + s.x*0.03)*1.2;
    if(s.x<0){s.x=W;s.y=Math.random()*H}
  });

  pt.forEach(p=>{p.x+=p.vx*p.life*dt*2;p.y+=p.vy*p.life*dt*2;p.life-=dt});pt=pt.filter(p=>p.life>0);

  if(scene=='title'){
    if(K.Enter==2||K.Space==2){scene='mode'}
    if(K.KeyC==2){scene='codex'}
    return
  }
  if(scene=='codex'){
    if(K.Escape==2||K.Backspace==2||K.Enter==2||K.Space==2||K.KeyC==2)scene='title';
    return
  }
  if(scene=='mode'){
    if(K.Digit1==2||K.Numpad1==2||K.Enter==2||K.Space==2){nP=1;scene='diff'}
    if(K.Digit2==2||K.Numpad2==2||K.KeyE==2){nP=2;scene='diff'}
    if(K.Escape==2||K.Backspace==2)scene='title';
    return
  }
  if(scene=='diff'){
    if(K.Digit1==2||K.Numpad1==2||K.KeyN==2||K.Enter==2||K.Space==2)start(nP,0);
    if(K.Digit2==2||K.Numpad2==2||K.KeyE==2)start(nP,1);
    if(K.Escape==2||K.Backspace==2)scene='mode';
    return
  }
  if(scene=='intro'){if(K.Enter==2||K.Space==2){scene='ready';tm=1.5;snd(440,.15,'triangle',.06)}return}
  if(scene=='ready'){tm-=dt;if(tm<=0){scene='play';snd(880,.25,'square',.05)}return}
  if(scene=='win'){if(K.Enter==2||K.Space==2)scene='title';return}
  if(scene=='lose'){if(K.Enter==2||K.Space==2)start(nP,hard);return}
  if(hs>0){hs-=dt;return}

  clock+=dt;eclipse=Math.max(0,eclipse-dt);
  combo=P.length>1&&P.every(p=>p.alive)&&Math.abs(P[0].y-P[1].y)<46;
  P.forEach(p=>upP(p,dt));upB(dt);

  bul.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});
  bul=bul.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);

  asteroids.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt});
  asteroids=asteroids.filter(a=>a.x>-40);

  pk.forEach(o=>{o.x+=o.vx*dt;o.y+=o.vy*dt});pk=pk.filter(o=>o.x>-30);

  pwItems.forEach(pw=>{pw.x+=pw.vx*dt;pw.y+=pw.vy*dt});
  pwItems=pwItems.filter(pw=>pw.x>-30);

  P.forEach(p=>{
    if(!p.alive||p.inv>0)return;
    const b=bul.find(b=>Math.hypot(b.x-p.x,b.y-p.y)<b.r+7);
    if(b){bul=bul.filter(q=>q!==b);hurt(p)}
    const ast=asteroids.find(a=>Math.hypot(a.x-p.x,a.y-p.y)<a.r+12);
    if(ast){asteroids=asteroids.filter(q=>q!==ast);hurt(p)}
  });

  pwItems=pwItems.filter(pw=>{
    const p=P.find(p=>p.alive&&Math.hypot(pw.x-p.x,pw.y-p.y)<pw.r+18);
    if(p){
      if(pw.type==='spec'){ p.boost=6.0; tip='ESPECTRÔMETRO: Velocidade de disparo ultra-rápida!'; tipT=3; snd(600,.2,'triangle',.08,200); }
      else if(pw.type==='grav'){ p.shield=8.0; tip='MICROLENTE GRAVITACIONAL: Campo de força protetor ativado!'; tipT=3; snd(500,.25,'sine',.08,300); }
      else if(pw.type==='solar'){ p.hp=Math.min(5, p.hp+1); tip='PAINEL SOLAR: Energia e vida restauradas (+1 ♥)!'; tipT=3; snd(800,.3,'sine',.08,400); }
      boom(pw.x, pw.y, pw.col, 15);
      return false;
    }
    return true;
  });

  pk=pk.filter(o=>{
    const p=P.find(p=>p.alive&&Math.hypot(o.x-p.x,o.y-p.y)<o.r+16);
    if(p){
      p.ex=Math.min(5,p.ex+1);snd(900,.12,'sine',.06,300);boom(o.x,o.y,'#ff7ad9',10);return false
    }
    return true;
  });

  sh=sh.filter(s=>{
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.x>W+30||s.y<-20||s.y>H+20)return false;

    const ast=asteroids.find(a=>Math.hypot(s.x-a.x,s.y-a.y)<a.r+6);
    if(ast){
      ast.hp-=s.d;
      boom(s.x,s.y,'#c2a67e',4);
      if(ast.hp<=0){
        asteroids=asteroids.filter(q=>q!==ast);
        boom(ast.x,ast.y,'#e6c89c',16);
        snd(220,.15,'sawtooth',.06,-50);
        if(Math.random()<0.45){
          const types=['spec','grav','solar'], cols=['#4fd8c4','#ffd34d','#4dff88'];
          const idx=Math.floor(Math.random()*types.length);
          pwItems.push({x:ast.x,y:ast.y,vx:-80,vy:0,r:10,type:types[idx],col:cols[idx]});
        }
      }
      return false;
    }

    if(Math.hypot(s.x-B.x,s.y-B.y)<B.r+4){
      B.hp-=s.d*(B.stun>0?2:1);B.hit=.06;
      boom(s.x,s.y,'#ffe08a',combo?5:2);
      if(combo) flashW = 0.08;
      return false;
    }
    return true;
  });

  if(B.hp<=0){scene='win';bul=[];pk=[];sh=[];asteroids=[];pwItems=[];boom(B.x,B.y,'#ffe08a',90);shake=24;snd(60,.8,'sawtooth',.12,-30)}
  else if(P.every(p=>!p.alive)){scene='lose';snd(70,.7,'sawtooth',.1,-30)}
}

function T(s,x,y,sz,col,al,f){X.font=sz+'px '+(f||'Bungee,Impact,sans-serif');X.textAlign=al||'left';X.fillStyle=col||'#efe2c2';X.fillText(s,x,y)}
function WR(s,x,y,w,lh,sz,col){X.font=sz+'px Georgia,serif';X.fillStyle=col||'#efe2c2';X.textAlign='left';let l='';for(const wd of s.split(' ')){const t2=l+wd+' ';if(X.measureText(t2).width>w&&l){X.fillText(l,x,y);y+=lh;l=wd+' '}else l=t2}X.fillText(l,x,y);return y+lh}

function bg(){
  const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b1440');g.addColorStop(1,'#3a1f52');X.fillStyle=g;X.fillRect(0,0,W,H);
  [[200,120,260,'rgba(255,138,61,.14)'],[760,420,300,'rgba(79,216,196,.12)']].forEach(n=>{const r=X.createRadialGradient(n[0],n[1],0,n[0],n[1],n[2]);r.addColorStop(0,n[3]);r.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=r;X.fillRect(0,0,W,H)});
  X.fillStyle='#e9a25a';X.beginPath();X.arc(180,H+150,270,0,7);X.fill();X.strokeStyle='#1d1a2e';X.lineWidth=5;X.stroke();
  stars.forEach(s=>{X.fillStyle='rgba(255,244,214,'+(.3+s.z*.25)+')';X.fillRect(s.x,s.y,s.z,s.z)});
}

function ship(p){
  X.save();X.translate(p.x,p.y);if(p.inv>0&&((p.inv*20)|0)%2)X.globalAlpha=.35;
  if(p.shield > 0){
    X.strokeStyle='#ffd34d';X.lineWidth=3;X.beginPath();X.arc(0,0,28+Math.sin(t*10)*2,0,7);X.stroke();
    X.fillStyle='rgba(255,211,77,0.15)';X.fill();
  }

  X.lineWidth=3;X.strokeStyle='#1d1a2e';
  const w=p.mode?24:9;X.fillStyle='#3a6ea5';
  X.fillRect(-8,-12-w,14,w);X.strokeRect(-8,-12-w,14,w);X.fillRect(-8,12,14,w);X.strokeRect(-8,12,14,w);
  X.fillStyle=p.boost>0?'#8be8ff':p.col;X.beginPath();X.moveTo(28,0);X.lineTo(-18,-13);X.lineTo(-10,0);X.lineTo(-18,13);X.closePath();X.fill();X.stroke();
  X.fillStyle='#efe2c2';X.fillRect(-6,-6,24,12);X.strokeRect(-6,-6,24,12);
  X.fillStyle='#ffd34d';X.beginPath();X.moveTo(-18,-5);X.lineTo(-30-Math.random()*8,0);X.lineTo(-18,5);X.fill();
  X.restore();
}

function drawB(){
  if(!B)return;
  X.save();X.translate(B.x,B.y);
  X.filter=hard?(B.ph==1?'blur(7px)':B.ph==2?'blur(3.5px)':'none'):'blur('+(7*Math.max(0,(B.hp/B.max-.1)/.9)).toFixed(1)+'px)';
  X.lineWidth=5;X.strokeStyle='#1d1a2e';
  X.fillStyle=B.hit>0?'#fff':'#e8d6a8';X.beginPath();X.arc(0,0,B.r,0,7);X.fill();X.stroke();
  X.fillStyle='#c9b27d';X.beginPath();X.arc(0,0,B.r*.74,0,7);X.fill();X.stroke();
  const a=P.find(p=>p.alive)||P[0],an=a?Math.atan2(a.y-B.y,a.x-B.x):0;
  [-48,-8].forEach(ex=>{X.fillStyle='#fff';X.beginPath();X.arc(ex,-22,17,0,7);X.fill();X.stroke();X.fillStyle='#1d1a2e';X.beginPath();X.arc(ex+Math.cos(an)*7,-22+Math.sin(an)*7,7,0,7);X.fill()});
  if(B.ph==3){X.lineWidth=6;X.beginPath();X.moveTo(-68,-48);X.lineTo(-32,-38);X.moveTo(12,-48);X.lineTo(-24,-38);X.stroke()}
  X.fillStyle='#1d1a2e';X.beginPath();X.ellipse(-28,28,22,6+(B.open>0?16:0),0,0,7);X.fill();
  X.filter='none';
  if(eclipse>0){X.fillStyle='#000';X.beginPath();X.arc(0,0,B.r+4,0,7);X.fill();X.strokeStyle='rgba(255,226,160,'+Math.min(1,eclipse)+')';X.lineWidth=12;X.beginPath();X.arc(0,0,B.r+10+(1.6-eclipse)*50,0,7);X.stroke()}
  X.restore();
}

function drawTouchOverlay(){
  if(!isTouch)return;
  X.save();X.globalAlpha=0.35;X.lineWidth=3;X.strokeStyle='#efe2c2';X.fillStyle='#efe2c2';
  const cx=100, cy=H-100;
  X.beginPath();X.arc(cx,cy,55,0,7);X.stroke();
  T('▲',cx,cy-25,20,'#efe2c2','center');
  T('▼',cx,cy+35,20,'#efe2c2','center');
  T('◄',cx-30,cy+7,20,'#efe2c2','center');
  T('►',cx+30,cy+7,20,'#efe2c2','center');

  const bx=W-100, by=H-100;
  X.beginPath();X.arc(bx,by+20,28,0,7);X.stroke();T('TIRO',bx,by+26,12,'#efe2c2','center');
  X.beginPath();X.arc(bx-55,by-10,24,0,7);X.stroke();T('MODO',bx-55,by-5,11,'#efe2c2','center');
  X.beginPath();X.arc(bx,by-50,24,0,7);X.stroke();T('ESPECIAL',bx,by-45,9,'#efe2c2','center');
  X.restore();
}

function draw(){
  X.setTransform(1,0,0,1,0,0);X.clearRect(0,0,W,H);
  X.save();if(shake>0)X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  bg();

  if(scene!='title'&&scene!='codex'&&scene!='mode'&&scene!='diff'&&scene!='intro'){
    if(scene!='win')drawB();

    asteroids.forEach(a=>{
      X.fillStyle='#8c7355';X.strokeStyle='#1d1a2e';X.lineWidth=3;
      X.beginPath();X.arc(a.x,a.y,a.r,0,7);X.fill();X.stroke();
      X.fillStyle='#69533a';X.beginPath();X.arc(a.x-3,a.y-3,a.r*0.4,0,7);X.fill();
    });

    pwItems.forEach(pw=>{
      X.fillStyle=pw.col;X.strokeStyle='#fff';X.lineWidth=2.5;
      X.beginPath();X.arc(pw.x,pw.y,pw.r+Math.sin(t*8)*2,0,7);X.fill();X.stroke();
      T(pw.type==='spec'?'S':pw.type==='grav'?'G':'♥',pw.x,pw.y+4,11,'#1d1a2e','center','Georgia,serif');
    });

    pk.forEach(o=>{X.fillStyle='#ff7ad9';X.strokeStyle='#fff';X.lineWidth=3;X.beginPath();X.arc(o.x,o.y,o.r+Math.sin(t*10)*2,0,7);X.fill();X.stroke()});
    bul.forEach(b=>{X.fillStyle='#fff3c4';X.strokeStyle='#1d1a2e';X.lineWidth=2.5;X.beginPath();X.arc(b.x,b.y,b.r,0,7);X.fill();X.stroke()});

    sh.forEach(s=>{
      X.fillStyle=combo?'#ffea78':(s.m?'#8be8ff':'#ffe08a');
      X.fillRect(s.x-(s.m?7:16),s.y-(s.m?(combo?4:2):3),s.m?14:(combo?40:32),s.m?(combo?8:4):(combo?10:6));
    });

    P.forEach(p=>{if(p.alive)ship(p)});
  }

  pt.forEach(p=>{X.fillStyle=p.col;X.globalAlpha=cl(p.life*2,0,1);X.fillRect(p.x,p.y,p.r,p.r)});X.globalAlpha=1;
  X.restore();

  if(flashR>0){X.fillStyle='rgba(255,60,60,'+flashR+')';X.fillRect(0,0,W,H);}
  if(flashW>0){X.fillStyle='rgba(255,255,255,'+flashW+')';X.fillRect(0,0,W,H);}

  X.fillStyle=V;X.fillRect(0,0,W,H);
  for(let i=0;i<50;i++){X.fillStyle=Math.random()<.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.12)';X.fillRect(Math.random()*W,Math.random()*H,2,2)}
  
  hud();
  if(scene==='play'||scene==='intro') drawTouchOverlay();
}

function panel(){X.fillStyle='rgba(20,12,40,.88)';X.fillRect(70,50,W-140,H-100);X.strokeStyle='#efe2c2';X.lineWidth=4;X.strokeRect(70,50,W-140,H-100)}

    T('1 (A) · NORMAL',W/2,235,40,'#8be8ff','center');
    T('O chefe ataca só com a primeira fase e o espelho vai ficando nítido a cada acerto.',W/2,272,17,'#efe2c2','center','Georgia,serif');
    T('2 (Y/B) · ESPECIALISTA',W/2,355,40,'#ff9a47','center');
    T('Três fases: o chefe fica nítido, com espiral e rajadas furiosas.',W/2,392,17,'#efe2c2','center','Georgia,serif');
    T('ESC ou SELECT para voltar',W/2,465,16,'#efe2c2','center','Georgia,serif');return}
  if(scene=='title'){
    T('ROMAN',W/2,195,120,'#ffb15c','center');T('Guardiã das Estrelas',W/2,255,30,'#efe2c2','center');
    T('Pressione ENTER / ESPAÇO / START para Iniciar',W/2,335,22,'#8be8ff','center');
    T('Pressione C para o CODEX CIENTÍFICO DA NASA',W/2,375,18,'#ffd34d','center');
    X.font='16px Georgia,serif';X.textAlign='center';X.fillStyle='#efe2c2';X.fillText('Protótipo Expandido · jogue com Teclado, Controle ou Touch Screen',W/2,435);
    X.save();X.translate(W/2,320);X.rotate(Math.sin(t*2)*.08);X.restore();return}
  if(scene=='intro'){
    panel();T('FASE 1 · HUBBLE, 1990',100,105,30,'#ffb15c');
    let y=WR('“Aqui é Nancy Grace Roman. Em 1960 virei a primeira astrônoma-chefe da NASA e briguei por telescópios no espaço, acima do ar que borra as estrelas. O Hubble foi a prova. Mas o espelho dele nasceu com um defeito e as imagens saíram borradas. Ajude a deixar tudo nítido!”',100,145,W-200,26,20);
    y=WR('Destrua asteroides para obter itens de ciência (Espectrômetro, Microlente e Painel Solar). Pegue 5 orbes para o Coronógrafo!',100,y+8,W-200,24,17,'#ff9ad9');
    y+=4;
    if(nP==1){T('Mover: WASD, Setas, Analógico ou Touch',100,y+10,16,'#8be8ff');T('Atirar: J, Espaço ou A / RT',100,y+36,16,'#8be8ff');T('Trocar Hubble/Roman: K ou X / LT',100,y+62,16,'#8be8ff');T('Coronógrafo: L ou Y / B',100,y+88,16,'#8be8ff')}
    else{T('P1 (laranja): WASD, J atira, K troca, L coronógrafo',100,y+10,16,'#ff9a47');T('P2 (verde): setas, vírgula atira, ponto troca, barra coronógrafo',100,y+36,16,'#4fd8c4');T('Controles: Analógico move, A atira, X troca, Y ataca!',100,y+62,16,'#8be8ff')}
    T('ENTER, START ou toque para começar',W/2,H-72,24,'#ffe08a','center');return}
  if(scene=='ready'){T('PREPARAR…',W/2,H/2-10,70,'#ffe08a','center');if(tm<.8)T('OBSERVAR!',W/2,H/2+70,80,'#ff9a47','center');return}
  
  P.forEach((p,i)=>{
    const y=34+i*52,c=p.col;T('P'+(i+1),18,y,18,c);

    for(let k=0;k<5;k++){X.fillStyle=k<p.ex?'#ff7ad9':'rgba(255,255,255,.2)';X.fillRect(18+k*16,y+8,12,8)}

  if(combo)T('ALINHADOS! TIRO COMBINADO DE ALTO DANO',W/2,H-60,18,'#8be8ff','center');
  const bw=380,bx=W/2-bw/2+70;X.fillStyle='rgba(0,0,0,.5)';X.fillRect(bx,16,bw,14);X.fillStyle='#ff9a47';X.fillRect(bx,16,bw*cl(B.hp/B.max,0,1),14);X.strokeStyle='#efe2c2';X.lineWidth=2;X.strokeRect(bx,16,bw,14);

  if(tipT>0&&scene=='play'){X.globalAlpha=cl(tipT,0,1);X.font='17px Georgia,serif';X.textAlign='center';X.fillStyle='#ffe08a';X.fillText(tip,W/2,H-28);X.globalAlpha=1}

  if(scene=='win'){
    panel();T('IMAGEM NÍTIDA!',W/2,115,48,'#ffb15c','center');
    const g=hits==0&&clock<80?'S':hits<=2?'A':'B';
    T('Nota '+g,W/2,175,34,'#8be8ff','center');
    T('Tempo: '+clock.toFixed(1)+' s · Acertos sofridos: '+hits+' · '+(hard?'Especialista':'Normal'),W/2,205,16,'#efe2c2','center');
    let y=WR('Carta Estelar 1: o espelho do Hubble tinha um defeito de fabricação (aberração esférica). Em 1993, astronautas instalaram uma óptica corretiva e as imagens ficaram nítidas.',100,245,W-200,24,18);
    y=WR('Carta Estelar 2: o telescópio que leva o nome da Nancy, o Roman, tem seu campo de visão cerca de 100 vezes maior que o do Hubble.',100,y+8,W-200,24,18,'#ff9ad9');
    T('ENTER ou START para voltar',W/2,H-72,20,'#ffe08a','center')}
  if(scene=='lose'){panel();T('IMAGEM BORRADA…',W/2,215,50,'#ff5a6a','center');T('A Aberração venceu desta vez.',W/2,265,20,'#efe2c2','center');T('ENTER ou START para tentar de novo',W/2,340,24,'#ffe08a','center')}
}

addEventListener('touchstart', e=>{
  isTouch=true; initAudio();
  const rect=C.getBoundingClientRect(), scaleX=W/rect.width, scaleY=H/rect.height;
  for(let i=0; i<e.touches.length; i++){
    const t=e.touches[i], tx=(t.clientX-rect.left)*scaleX, ty=(t.clientY-rect.top)*scaleY;
    if(tx < W/2){
      if(ty < H-110) K.KeyW=2;
      else if(ty > H-60) K.KeyS=2;
      if(tx < 80) K.KeyA=2;
      else if(tx > 120) K.KeyD=2;
    }else{
      if(ty > H-100 && tx > W-130) K.KeyJ=2;
      else if(tx < W-110 && ty < H-60) K.KeyK=2;
      else if(ty < H-100) K.KeyL=2;
      if(scene!=='play') K.Enter=2;
    }
  }
});

addEventListener('touchend', e=>{
  if(e.touches.length===0){
    K.KeyW=0;K.KeyS=0;K.KeyA=0;K.KeyD=0;K.KeyJ=0;K.KeyK=0;K.KeyL=0;K.Enter=0;
  }
});

let gpPrev=[{},{}];
function pollGP(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(let i=0;i<2;i++){
    const gp=pads[i];if(!gp)continue;
    const setK=(c,p)=>{const pr=gpPrev[i][c];if(p&&!pr)K[c]=2;else if(p&&pr){if(K[c]!=2)K[c]=1}else if(!p&&pr)K[c]=0;gpPrev[i][c]=p;};
    const k=KEYS[i],b=gp.buttons,B=x=>b[x]&&b[x].pressed,ax=gp.axes,A=(x,d)=>ax[x]!==undefined&&(d<0?ax[x]<-0.4:ax[x]>0.4);
    setK(k.u,B(12)||A(1,-1));setK(k.d,B(13)||A(1,1));setK(k.l,B(14)||A(0,-1));setK(k.r,B(15)||A(0,1));
    const f=B(0)||B(7);setK(k.f,f);setK(k.m,B(2)||B(6));setK(k.x,B(3)||B(1));
    setK('Enter',B(9));if(i===0){setK('Space',f);setK('Digit2',B(3)||B(1));setK('Escape',B(8));}
  }
}

let last=performance.now();
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;t+=dt;pollGP();step(dt);draw();for(const k in K)if(K[k]==2)K[k]=1;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
